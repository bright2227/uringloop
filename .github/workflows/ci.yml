name: ci

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare environment
        uses: ./.github/actions/prepare
        with:
          python-version: ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check uringloop tests benchmarks scripts

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Record CPython asyncio compatibility baseline
        run: |
          uv run python scripts/compat_baseline.py \
            --verify-upstream \
            --output "artifacts/compat-${{ matrix.python-version }}.json"

      - name: Upload compatibility baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-${{ matrix.python-version }}
          path: artifacts/compat-${{ matrix.python-version }}.json

  native-sanitizers:
    name: Native ASAN and UBSAN
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.12"
      URINGLOOP_SANITIZERS: address,undefined
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare environment
        uses: ./.github/actions/prepare
        with:
          python-version: "3.12"

      - name: Build instrumented extensions and vendored liburing
        run: uv run --with 'setuptools>=78' python setup.py build_ext --inplace --force

      - name: Run deterministic native transport and dispatch contracts
        run: |
          LD_PRELOAD="$(gcc -print-file-name=libasan.so)" \
            .venv/bin/python -m pytest \
              tests/unit/test_native_protocol_dispatch.py \
              tests/unit/test_native_stream_transport.py \
              tests/unit/test_native_stream_flow_control.py \
              tests/unit/test_native_transport_proactor.py -v

      - name: Run native ring tests
        run: |
          LD_PRELOAD="$(gcc -print-file-name=libasan.so)" \
            .venv/bin/python -m pytest tests/e2e/native -v

      - name: Run event-loop e2e tests
        run: |
          LD_PRELOAD="$(gcc -print-file-name=libasan.so)" \
            .venv/bin/python -m pytest tests/e2e/loop tests/e2e/proactor -v

  check-sdist:
    name: Check source distribution
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build source distribution
        uses: ./.github/actions/build-distribution
        with:
          kind: sdist

  check-wheel:
    name: Check ${{ matrix.build }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        build:
          - cp312-manylinux_x86_64
          - cp313-manylinux_x86_64
          - cp312-musllinux_x86_64
          - cp313-musllinux_x86_64
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build wheel
        uses: ./.github/actions/build-distribution
        with:
          kind: wheel
          wheel-build: ${{ matrix.build }}
